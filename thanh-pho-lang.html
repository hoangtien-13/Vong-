<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Thành Phố Lặng</title>
<meta name="theme-color" content="#07080b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thành Phố Lặng">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b;--panel:#0d1016;--line:#1e2531;--txt:#c9d1dc;--dim:#6b7686;
  --red:#ff2e4d;--cyan:#3de1ff;--amber:#ffb547;--green:#4dffa6;--violet:#b98cff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Be Vietnam Pro',system-ui,sans-serif;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.mono{font-family:'Chakra Petch',ui-monospace,Consolas,monospace}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.8) 100%)}

main{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:100vh;min-height:100dvh}

/* ---------- header ---------- */
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.title{font-size:clamp(30px,8vw,54px);font-weight:800;letter-spacing:.05em;color:#fff;line-height:1;
  text-shadow:0 0 18px rgba(255,46,77,.6),2px 0 var(--red),-2px 0 var(--cyan);animation:flick 5s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.6}}
.sub{font-size:13px;color:var(--dim);letter-spacing:.25em;margin-top:8px}
.clock{text-align:right}
.clock .lbl{font-size:12px;color:var(--dim);letter-spacing:.2em}
.clock .val{font-size:44px;color:var(--amber);text-shadow:0 0 16px rgba(255,181,71,.5);line-height:1}
.clock .val small{font-size:16px;color:var(--dim);margin-left:6px}
.clock.low .val{color:var(--red);text-shadow:0 0 16px rgba(255,46,77,.6);animation:jit .15s infinite}
@keyframes jit{50%{transform:translate(1px,-1px)}}

.announce{min-height:1.6em;color:var(--amber);font-size:16px}
.progress{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim);letter-spacing:.08em}
.progress b{color:var(--green);font-weight:400}

/* ---------- city ---------- */
.city{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;padding-top:10px}
@media (max-width:620px){.city{grid-template-columns:repeat(2,1fr)}}
.city::after{content:"";position:absolute;left:-16px;right:-16px;bottom:-8px;height:2px;background:linear-gradient(90deg,transparent,#2a3342,transparent)}

.bld{--c:var(--cyan);position:relative;display:flex;flex-direction:column;text-align:left;background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0}
.bld .sign{align-self:center;font-size:26px;color:var(--c);text-shadow:0 0 14px var(--c);margin-bottom:6px;height:32px}
.bld .facade{position:relative;height:var(--h,170px);background:linear-gradient(180deg,#121823,#0a0d13);
  border:1px solid #1f2733;border-bottom:none;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-content:start;
  transition:box-shadow .2s,border-color .2s}
.bld .win{height:12px;background:#151b25}
.bld .win.on{background:var(--c);opacity:.75;box-shadow:0 0 8px var(--c)}
.bld .door{position:absolute;bottom:0;left:50%;width:26px;height:34px;margin-left:-13px;background:#05070a;border:1px solid #2a3342;border-bottom:none}
.bld.open .door{background:var(--c);box-shadow:0 0 18px var(--c);animation:breathe 2.4s infinite}
@keyframes breathe{50%{opacity:.55}}
.bld .info{border:1px solid #1f2733;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.bld .bname{font-weight:800;color:#fff;font-size:15px;letter-spacing:.03em}
.bld .meta{font-size:12px;color:var(--c);letter-spacing:.08em}
.bld .deal{font-size:12px;color:var(--dim)}
.bld .status{margin-top:4px;font-size:12px;letter-spacing:.15em;font-family:'Chakra Petch',monospace}
.bld.open .status{color:var(--c)}
.bld.open:hover .facade,.bld.open:focus-visible .facade{border-color:var(--c);box-shadow:0 0 24px color-mix(in srgb,var(--c) 40%,transparent)}
.bld.open:focus-visible{outline:none}
.bld.done{cursor:default}
.bld.done .facade{filter:grayscale(1) brightness(.6)}
.bld.done .sign{color:var(--green);text-shadow:0 0 10px var(--green)}
.bld.done .status{color:var(--green)}
.bld.soon,.bld.lock,.bld.broke{cursor:default}
.bld.soon .facade,.bld.lock .facade,.bld.broke .facade{filter:brightness(.45)}
.bld.soon .sign,.bld.lock .sign{color:#3a4352;text-shadow:none}
.bld.soon .status,.bld.lock .status,.bld.broke .status{color:var(--dim)}
.bld.tower .bname{color:var(--violet)}

.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.link{background:none;border:none;color:var(--dim);font-family:'Chakra Petch',monospace;letter-spacing:.1em;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.link:hover{color:var(--red)}

/* ---------- buttons ---------- */
.btn{font-family:'Chakra Petch',monospace;font-size:16px;letter-spacing:.12em;color:var(--cyan);
  background:transparent;border:1px solid var(--cyan);padding:12px 18px;cursor:pointer;
  box-shadow:0 0 12px rgba(61,225,255,.25),inset 0 0 12px rgba(61,225,255,.08);transition:.15s}
.btn:hover{background:rgba(61,225,255,.1)}
.btn.red{color:var(--red);border-color:var(--red);box-shadow:0 0 12px rgba(255,46,77,.3),inset 0 0 12px rgba(255,46,77,.08)}
.btn.red:hover{background:rgba(255,46,77,.12)}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(3,4,6,.82);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.veil.on{display:flex}
.sheet{width:100%;max-width:440px;border:1px solid var(--line);background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 0 40px rgba(0,0,0,.8);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sheet .tag{font-size:13px;letter-spacing:.25em;color:var(--red)}
.sheet h2{font-size:28px;color:#fff;letter-spacing:.04em}
.sheet p{font-size:15px;line-height:1.6}
.sheet .calc{border:1px dashed #2a3342;padding:10px 12px;font-size:14px;line-height:1.8}
.sheet .calc b{color:var(--amber);font-weight:400}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{flex:1}

.over .sheet h2{color:var(--red);text-shadow:0 0 18px rgba(255,46,77,.6)}
/* phông chữ: Chakra Petch cho tiêu đề, nhãn, số; Be Vietnam Pro cho đoạn văn */
.title,.big,.bname,.sheet h2,#ending .big{font-family:'Chakra Petch',sans-serif;font-weight:700}
.timer,.score,.slot,.clock .val,.try .code{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="title">THÀNH PHỐ LẶNG</div>
      <div class="sub mono">CHỌN MỘT TÒA NHÀ ĐỂ BƯỚC VÀO</div>
    </div>
    <div class="clock mono" id="clock">
      <div class="lbl">THỜI GIAN CÒN LẠI</div>
      <div class="val"><span id="days">3</span><small>NGÀY</small></div>
    </div>
  </header>

  <div class="announce mono" id="announce"></div>
  <div class="progress mono">
    <span>ĐÃ VƯỢT QUA: <b id="cleared">0/5</b></span>
    <span>PHÍ VÀO MỖI TÒA NHÀ: 1 NGÀY</span>
  </div>

  <div class="city" id="city"></div>

  <div class="foot">
    <span>Thắng: được cộng ngày sống. Thua: bị loại. Hết ngày: bị loại.</span>
    <button class="link" id="resetLink">CHƠI LẠI TỪ ĐẦU</button>
  </div>
</main>

<!-- xác nhận vào tòa nhà -->
<div class="veil" id="enterVeil">
  <div class="sheet">
    <div class="tag mono" id="eTag"></div>
    <h2 id="eName"></h2>
    <p id="eDesc"></p>
    <div class="calc mono" id="eCalc"></div>
    <div class="row">
      <button class="btn" id="eCancel">◂ QUAY LẠI</button>
      <button class="btn red" id="eGo">BƯỚC VÀO ▸</button>
    </div>
  </div>
</div>

<!-- bị loại / reset -->
<div class="veil over" id="overVeil">
  <div class="sheet">
    <div class="tag mono">THÀNH PHỐ LẶNG</div>
    <h2 id="oTitle">GAME OVER</h2>
    <p id="oText"></p>
    <div class="row">
      <button class="btn" id="oCancel" style="display:none">◂ QUAY LẠI</button>
      <button class="btn red" id="oReset">CHƠI LẠI TỪ ĐẦU</button>
    </div>
  </div>
</div>

<script>
/* ---------- lượt chơi chung (dùng chung với các trò chơi) ---------- */
const RUN = (() => {
  const KEY = 'thanh-pho-lang-run', START = 3;
  const q = new URLSearchParams(location.search);
  let st = null;
  if (q.has('d')) st = { days: +q.get('d'), done: (q.get('c') || '').split(',').filter(Boolean) };
  else try { st = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!st || !Number.isFinite(st.days) || !Array.isArray(st.done)) st = { days: START, done: [] };
  const save = s => { st = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
  save(st);
  return { START, get: () => st, save,
    url: file => `${file}?d=${st.days}&c=${st.done.join(',')}` };
})();

(() => {
  const FEE = 1;
  const BUILDINGS = [
    { id: 'can',  sym: '◆', type: 'TRÍ TUỆ', name: 'PHÒNG CÂN',         stars: 2, reward: 3, file: 'phong-can.html',       c: 'var(--cyan)',  h: 150,
      desc: '9 quả cầu, một quả nặng hơn. 2 lần cân, 1 lần đoán.' },
    { id: 'den',  sym: '●', type: 'TRÍ NHỚ', name: 'HÀNH LANG ĐÈN',     stars: 2, reward: 3, file: 'hanh-lang-den.html',   c: 'var(--amber)', h: 190,
      desc: 'Ghi nhớ thứ tự đèn sáng trên 9 cánh cửa. Từ vòng 5, mọi thứ đảo ngược.' },
    { id: 'nuoc', sym: '▲', type: 'ÁP LỰC',  name: 'PHÒNG NGẬP NƯỚC',   stars: 3, reward: 5, file: 'phong-ngap-nuoc.html', c: 'var(--red)',   h: 170,
      desc: 'Xoay ống nối van với cống trước khi nước ngập tới trần. 3 căn phòng.' },
    { id: 'cua',  sym: '◆', type: 'TRÍ TUỆ', name: 'BỐN CÁNH CỬA',      stars: 4, reward: 7, file: 'bon-canh-cua.html', c: 'var(--cyan)', h: 210,
      desc: 'Bốn người gác, một vài kẻ nói dối. Chỉ một cửa an toàn.' },
    { id: 'tin',  sym: '■', type: 'LÒNG TIN', name: 'VÁN BÀI LÒNG TIN', stars: 5, reward: 9, file: 'van-bai-long-tin.html', c: 'var(--green)', h: 230,
      desc: 'Hợp tác hay phản bội? Đọc tâm lý ba người chơi còn lại.' },
    { id: 'thap', sym: '✦', type: '???',     name: 'THÁP TRUNG TÂM',    stars: 0, reward: 0, file: 'thap-trung-tam.html', c: 'var(--violet)', h: 270, tower: true,
      desc: 'Chỉ mở khi vượt qua cả 5 trò chơi.' },
  ];
  const GAMES = BUILDINGS.filter(b => !b.tower);
  const $ = id => document.getElementById(id);

  /* ---------- audio ---------- */
  let ac = null;
  function beep(freq, dur = .12, type = 'sine', vol = .06, slide = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }

  function statusOf(b, run) {
    if (b.tower) return run.done.includes('thap') ? 'done' : GAMES.every(g => run.done.includes(g.id)) ? 'open' : 'lock';
    if (run.done.includes(b.id)) return 'done';
    if (!b.file) return 'soon';
    if (run.days <= FEE) return 'broke';
    return 'open';
  }
  const STATUS_TEXT = { open: '▸ ĐANG SÁNG ĐÈN', done: '✓ ĐÃ VƯỢT QUA', soon: '— CHƯA MỞ CỬA', lock: '🔒 ĐANG KHÓA', broke: '— KHÔNG ĐỦ NGÀY' };

  function windows(n, litRatio) {
    let s = '';
    for (let i = 0; i < n; i++) s += `<div class="win${Math.random() < litRatio ? ' on' : ''}"></div>`;
    return s;
  }

  function render() {
    const run = RUN.get();
    $('days').textContent = String(run.days).padStart(2, '0');
    $('clock').classList.toggle('low', run.days <= 2);
    $('cleared').textContent = `${run.done.filter(id => GAMES.some(g => g.id === id)).length}/${GAMES.length}`;

    const city = $('city'); city.innerHTML = '';
    for (const b of BUILDINGS) {
      const st = statusOf(b, run);
      const el = document.createElement('button');
      el.className = `bld ${st}${b.tower ? ' tower' : ''}`;
      el.style.setProperty('--c', b.c);
      el.style.setProperty('--h', b.h + 'px');
      const rows = Math.floor((b.h - 50) / 19);
      el.innerHTML = `
        <div class="sign">${b.sym}</div>
        <div class="facade">${windows(rows * 4, st === 'open' ? .45 : .15)}<div class="door"></div></div>
        <div class="info">
          <div class="bname">${b.name}</div>
          <div class="meta mono">${b.sym} ${b.type}${b.stars ? ' · ' + '★'.repeat(b.stars) : ''}</div>
          <div class="deal mono">${b.tower ? 'Bí ẩn cuối cùng' : `−${FEE} ngày · +${b.reward} ngày`}</div>
          <div class="status">${STATUS_TEXT[st]}</div>
        </div>`;
      if (st === 'open') el.onclick = () => askEnter(b);
      else el.onclick = () => beep(110, .15, 'square', .04);
      city.appendChild(el);
    }

    // bị loại: hết ngày, hoặc không đủ ngày để vào bất kỳ tòa nhà nào còn lại
    const remaining = GAMES.filter(g => g.file && !run.done.includes(g.id));
    if (run.days <= 0) return showOver('GAME OVER', 'Thời gian của bạn đã hết. Thành phố đã nuốt chửng thêm một người chơi.');
    if (remaining.length && run.days <= FEE)
      return showOver('GAME OVER', `Bạn chỉ còn ${run.days} ngày, không đủ trả phí vào bất kỳ tòa nhà nào. Khi đồng hồ điểm, bạn sẽ biến mất cùng thành phố.`);
    typeAnnounce(remaining.length
      ? `> Thời gian còn lại của bạn: ${run.days} ngày. Các tòa nhà đang sáng đèn đang chờ bạn.`
      : run.done.includes('thap')
        ? `> Bạn đã đi tới tận cùng thành phố. Có lẽ đã đến lúc bắt đầu lại.`
        : `> Năm tòa nhà đã tắt đèn. Tháp Trung Tâm đang chờ bạn.`);
  }

  let typeTimer;
  function typeAnnounce(text) {
    const el = $('announce'); el.textContent = ''; let i = 0;
    clearInterval(typeTimer);
    typeTimer = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typeTimer); }, 28);
  }

  /* ---------- vào tòa nhà ---------- */
  let pending = null;
  function askEnter(b) {
    pending = b;
    const d = RUN.get().days;
    $('eName').textContent = b.name;
    if (b.tower) {
      $('eTag').textContent = '✦ ???';
      $('eDesc').textContent = 'Năm tòa nhà đã tắt đèn. Câu trả lời cho câu hỏi "ai đã tạo ra thành phố này" nằm ở đỉnh tháp.';
      $('eCalc').innerHTML = `Ngày hiện có: <b>${d}</b><br>Phí vào cửa: <b>không</b><br>Nếu thất bại: <b>−3</b> ngày`;
    } else {
      $('eTag').textContent = `${b.sym} ${b.type} · ${'★'.repeat(b.stars)}`;
      $('eDesc').textContent = b.desc;
      $('eCalc').innerHTML = `Ngày hiện có: <b>${d}</b><br>Phí vào cửa: <b>−${FEE}</b> → còn <b>${d - FEE}</b> khi bắt đầu<br>Nếu thắng: <b>+${b.reward}</b> → <b>${d - FEE + b.reward}</b> ngày`;
    }
    $('enterVeil').classList.add('on');
    beep(330, .12, 'triangle', .05);
  }
  $('eCancel').onclick = () => { $('enterVeil').classList.remove('on'); pending = null; };
  $('eGo').onclick = () => {
    if (!pending) return;
    beep(220, .3, 'sawtooth', .06, 300);
    const url = RUN.url(pending.file);
    setTimeout(() => location.href = url, 250);
  };

  /* ---------- bị loại / chơi lại ---------- */
  function showOver(title, text, cancellable) {
    $('oTitle').textContent = title;
    $('oText').textContent = text;
    $('oCancel').style.display = cancellable ? '' : 'none';
    $('oReset').style.display = cancellable ? 'none' : '';
    $('overVeil').classList.add('on');
  }
  $('oCancel').onclick = () => $('overVeil').classList.remove('on');
  $('oReset').onclick = resetRun;
  $('resetLink').onclick = () => {
    showOver('CHƠI LẠI TỪ ĐẦU?', 'Toàn bộ tiến trình sẽ bị xóa. Bạn quay lại với 3 ngày sống và mọi tòa nhà sáng đèn trở lại.', true);
    $('oReset').style.display = '';
  };
  function resetRun() {
    RUN.save({ days: RUN.START, done: [] });
    location.href = RUN.url('thanh-pho-lang.html');
  }

  render();
})();
</script>
<script>
/* PWA: cho phép cài như app và chơi khi không có mạng (chỉ hoạt động khi chạy qua https hoặc localhost) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
