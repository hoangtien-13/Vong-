# Tự động đóng gói Vong Giới thành app Android mỗi khi bạn tải code mới lên nhánh main.
# Kết quả: file vong-gioi.apk ở trang Releases của repo (mục "apk-moi-nhat"), tải về cài thử trên điện thoại.
name: Build app Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mã ỨNG DỤNG AdMob. Đây là mã THỬ NGHIỆM của Google; thay bằng mã thật khi có tài khoản AdMob.
      ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
      # Khóa ký để build file AAB nộp Google Play (để trống thì bỏ qua bước này)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài Capacitor và plugin AdMob
        run: npm install --no-audit --no-fund

      - name: Gom các file game vào thư mục www
        run: |
          mkdir -p www
          cp *.html *.js manifest.json www/
          cp -r icons www/

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Tạo biểu tượng và màn hình chờ
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icons/maskable-512.png assets/logo.png
          npx --yes @capacitor/assets@4 generate --android \
            --iconBackgroundColor '#07080b' --iconBackgroundColorDark '#07080b' \
            --splashBackgroundColor '#07080b' --splashBackgroundColorDark '#07080b'

      - name: Cấu hình AdMob, màn hình dọc, số phiên bản
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const man = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(man, 'utf8');
          if (!m.includes('com.google.android.gms.ads.APPLICATION_ID'))
            m = m.replace(/<application[^>]*>/, s => s + '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />');
          m = m.replace(/<activity(?![^>]*screenOrientation)/, '<activity android:screenOrientation="portrait"');
          fs.writeFileSync(man, m);

          const str = 'android/app/src/main/res/values/strings.xml';
          let s = fs.readFileSync(str, 'utf8');
          if (!s.includes('admob_app_id'))
            s = s.replace('</resources>', `    <string name="admob_app_id">${process.env.ADMOB_APP_ID}</string>\n</resources>`);
          fs.writeFileSync(str, s);

          const g = 'android/app/build.gradle';
          const n = process.env.GITHUB_RUN_NUMBER;
          let b = fs.readFileSync(g, 'utf8');
          b = b.replace(/versionCode \d+/, 'versionCode ' + n).replace(/versionName "[^"]*"/, `versionName "1.0.${n}"`);
          fs.writeFileSync(g, b);
          console.log('Đã cấu hình: AdMob', process.env.ADMOB_APP_ID, '· phiên bản 1.0.' + n);
          EOF

      - name: Đồng bộ game và plugin vào dự án Android
        run: npx cap sync android

      - name: Build file APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đăng APK lên trang Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vong-gioi.apk
          gh release delete apk-moi-nhat --yes --cleanup-tag || true
          gh release create apk-moi-nhat vong-gioi.apk --prerelease \
            --title "Vong Giới · APK thử nghiệm (bản build ${{ github.run_number }})" \
            --notes "Bản thử nghiệm, dùng quảng cáo thử của Google. Tải file vong-gioi.apk về điện thoại Android rồi mở để cài (cho phép cài ứng dụng từ nguồn này nếu được hỏi)."

      - name: Lưu APK vào mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vong-gioi-apk
          path: vong-gioi.apk

      - name: Build file AAB đã ký để nộp Google Play
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Lưu AAB vào mục Artifacts
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: vong-gioi-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
